name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            portable: false
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            portable: false
          - platform: ubuntu-22.04
            args: ""
            portable: false
          - platform: windows-latest
            args: ""
            portable: true

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      - name: generate app icons
        run: npx tauri icon src/assets/logo.svg

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: mdio ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            **Windows**
            - `*-setup.exe` — NSIS installer
            - `*.exe` without `-setup` — portable executable (needs WebView2, included on Windows 11)

            **Linux** — `.AppImage`, `.deb`, `.rpm`, and the unbundled `--release` binary (needs WebKitGTK)
            **macOS** — `.dmg` / `.app`
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadPlainBinary: ${{ matrix.portable }}
          releaseAssetNamePattern: "[name]-[version]-[platform]-[arch][setup].[ext]"
          args: ${{ matrix.args }}

      - name: upload Linux release executable
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            tag="v${version}"
          fi
          src=""
          for candidate in src-tauri/target/release/mdio target/release/mdio; do
            if [[ -f "$candidate" ]]; then
              src="$candidate"
              break
            fi
          done
          if [[ -z "$src" ]]; then
            echo "could not find target/release/mdio"
            find . -path '*/target/release/mdio' -type f || true
            exit 1
          fi
          asset="mdio-${version}-linux-x86_64"
          cp "$src" "$asset"
          chmod +x "$asset"
          gh release upload "$tag" "$asset" --clobber
